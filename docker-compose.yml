services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: property_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  scraper:
    build: ./scraper
    restart: always
    depends_on:
      - postgres
    env_file: .env
    shm_size: '512mb'

  web:
    build: ./web
    restart: always
    depends_on:
      - postgres
    env_file: .env
    ports:
      - "5713:5713"

volumes:
  pgdata:
