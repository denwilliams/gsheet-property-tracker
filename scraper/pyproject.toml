[project]
name = "property-tracker-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "apscheduler>=3.10.4",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
